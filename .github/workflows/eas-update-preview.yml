name: Publish preview update

# Auto-publishes a JS-only OTA update to the "preview" channel on every push to main, so
# testers running the Preview build get it immediately. This does NOT touch production —
# see eas-update-production.yml for the separate, manually-triggered promotion step.
on:
  push:
    branches: [main]

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish to preview channel
        run: eas update --channel preview --message "${{ github.event.head_commit.message }}" --non-interactive
